name: Update YouTube Videos

on:
  schedule:
    - cron: '0 17 * * 6'  # Every Saturday at 12:00 PM Panama time (UTC-5)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-videos:
    name: Fetch latest @IPULPANAMA videos
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest videos and update HTML
        run: python scripts/update_videos.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predicas.html en/sermons.html
          git commit -m "chore: auto-update sermon videos from @IPULPANAMA [skip ci]"
          git push

      - name: Create release (triggers deploy)
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION="v$(date +%Y.%m.%d)"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Auto-update videos $VERSION" --notes "Automated weekly video update from @IPULPANAMA YouTube channel." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
